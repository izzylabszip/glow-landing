name: Promote to production

# Manual only — never runs on push. The owner approves each promotion by
# starting this workflow himself (or by asking Muse to start it).
# Two steps: (1) copy the landing repo into the Glow monorepo's landing/
# and push to main; (2) deploy the landing site to the gloww.dev Vercel
# project. Step 2 exists because the monorepo root vercel.json sets
# ignoreCommand "exit 0", so Vercel never builds the landing site from
# git pushes — it only moves via a direct deploy like this one.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the landing repo (dev source)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Check out the Glow monorepo (production target)
        uses: actions/checkout@v4
        with:
          repository: izzylabszip/Glow
          token: ${{ secrets.PROMOTE_TOKEN }}
          ref: main
          fetch-depth: 0
          path: prod

      - name: Get landing repo short SHA
        id: site_sha
        run: echo "short=$(git -C site rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Sync landing repo into prod/landing
        run: |
          mkdir -p prod/landing
          rsync -a --delete --exclude='.git' --exclude='.github' site/ prod/landing/

      - name: Commit and push to production main
        working-directory: prod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add landing
          if git diff --cached --quiet; then
            echo "No changes to promote — production already matches dev."
            exit 0
          fi
          git commit -m "Promote landing from izzylabszip/glow-landing @ ${{ steps.site_sha.outputs.short }}"
          git push origin main

      - name: Deploy the landing site to production (Vercel)
        working-directory: site
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p .vercel
          printf '{"projectId":"prj_GyTycig6VbOYSYvWEKjybozptHlQ","orgId":"team_z2gHlzP3ZBk9P7UNruBMAh0U"}' > .vercel/project.json
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
